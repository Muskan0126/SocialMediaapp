<h2>Reset Password</h2>
<body style="background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d); min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; flex-direction: column; font-family: sans-serif;"></body>
    <div style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; min-width: 300px;">
        <h2 style="margin-top: 0; color: #333;">Reset Password</h2> 
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            {% if messages %}
                <ul class="messages" style="list-style: none; padding: 0;">
                    {% for message in messages %}
                        <li class="{% if message.tags %}alert alert-{{ message.tags }}{% endif %}">
                            {{ message }}
                        </li>
                    {% endfor %}
                </ul>
            {% endif %}
            <button type="submit">
                Send OTP
            </button>
            <p><a href="{% url 'login' %}">← Login</a></p>
        </form>
