<!DOCTYPE html>

<html>
<head>

<title>Change Password</title>

<style>

body{
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    width:40%;
    margin:50px auto;
    background:#111;
    padding:30px;
    border-radius:12px;
    border:1px solid #262626;
}

h2{
    text-align:center;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    background:#1a1a1a;
    border:1px solid #333;
    border-radius:8px;
    color:white;
}

.errorlist{
    color:#ff4d4d;
    margin-top:5px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#e1306c;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#ff4f8b;
}

.back{
    display:block;
    margin-top:20px;
    text-align:center;
    color:white;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h2>Change Password</h2>

<form method="POST">

{% csrf_token %}

<div class="form-group">

<label>Old Password</label>

{{ form.old_password }}

{{ form.old_password.errors }}

</div>

<div class="form-group">

<label>New Password</label>

{{ form.new_password }}

{{ form.new_password.errors }}

</div>

<div class="form-group">

<label>Confirm Password</label>

{{ form.confirm_password }}

{{ form.confirm_password.errors }}

</div>

{{ form.non_field_errors }}

<button type="submit">

Change Password

</button>

</form>

<a
href="{% url 'profile_view' %}"
class="back"

>

Back to Profile

</a>

</div>

</body>
</html>
