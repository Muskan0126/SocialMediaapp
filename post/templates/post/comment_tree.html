<div
    class="comment-item"
    data-comment-id="{{ comment.id }}"
    style="
        margin-left:{{ level }}px;
        margin-top:5px;
        color:#ddd;
        background-color:black;
    "
>

    <strong>
        {{ comment.author.username }}
    </strong>

    {{ comment.comment }}

    <span
        class="reply-btn"
        data-comment-id="{{ comment.id }}"
        style="
            color:#4da6ff;
            cursor:pointer;
            margin-left:10px;
        "
    >
        &#8618;
    </span>

    <div class="reply-form-container"></div>

    <div class="reply-container">

        {% for reply in comment.replies.all %}

            {% include "post/comment_tree.html" with comment=reply level=level|add:40 %}

        {% endfor %}

    </div>

</div>
