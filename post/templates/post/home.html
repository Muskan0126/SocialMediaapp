

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: "Lato", sans-serif;
}

.sidenav {
  height: 100%;
  width: 0;
  position: fixed;
  z-index: 1;
  top: 0;
  left: 0;
  background-color: #111;
  overflow-x: hidden;
  transition: 0.5s;
  padding-top: 60px;
}

.sidenav a {
  padding: 20px 8px 8px 32px;
  text-decoration: none;
  font-size: 25px;
  color: #818181;
  display: block;
  transition: 0.3s;
}

.sidenav a:hover {
  color: #f1f1f1;
}

.sidenav .closebtn {
  position: absolute;
  top: 0;
  right: 25px;
  font-size: 36px;
  margin-left: 50px;
}

#main {
  transition: margin-left .5s;
  padding: 16px;
  background-color: #111;
  color : #f1f1f1;
}

@media screen and (max-height: 450px) {
  .sidenav {padding-top: 15px;}
  .sidenav a {font-size: 18px;}
}

.circle-pic {
  width: 70px;          
  height: 70px;         
  border-radius: 50%;    
  object-fit: cover;     
}

.container{
width:60%;
margin:auto;
margin-top:30px;
}

.stories{
display:flex;
overflow-x:auto;
gap:20px;
background:rgb(19, 18, 18);
padding:15px;
border:1px solid #0a0a0a;
margin-bottom:20px;
}

.story{
text-align:center;
color : white
}

.story img{
width:70px;
height:70px;
border-radius:50%;
border:3px solid hotpink;
object-fit:cover;
}

.post{
background:rgb(12, 12, 12);
border:1px solid #0f0f0f;
margin-bottom:25px;
}

.post-header{
padding:15px;
font-weight:bold;
color : white;
font-size: 25px;
}

.post-image{
width:800px;
max-height:400px;
object-fit:cover; 
margin-left: auto;   
margin-right: auto;}

.post-content{
padding:15px;
align-content: center;
}

.post-caption{
margin-top:10px;
color : rgb(255, 247, 247)
}


</style>
</head>
<body>

<div id="mySidenav" class="sidenav">
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
  <a href="{% url 'home' %}"> Home</a>
  <a href="#">&#8506 Message</a>
  <a href="{% url 'create_post' %}"> &#128934 Add Post</a>
  <a href="{% url 'create_story' %}"> &#128934 Add Story</a>
  <a href="{% url 'logout' %}">&#10149 Signout</a>
  <a href="#"> &#9787 Profile</a>
</div>

<div id="main">
    <span style="font-size:30px;color: #c0358b;cursor:pointer" onclick="openNav()">&#9776; Instagram</span>
    
    <div class="container">

        <div class="stories">
        
        {% for story in stories %}
        
        <div class="story">
        
        <img src="{{ story.image.url }}">
        
        <p>{{ story.user.username }}</p>
        
        </div>
        
        {% endfor %}
        
        </div>
        
        {% for post in posts %}
        
        <div class="post">
        
        <div class="post-header">
        
        {{ post.user.username }}
        
        </div>
        
        <img
        class="post-image"
        src="{{ post.picture.url }}"
        
        >
        
        <div class="post-content">
        
        <div>
        ❤️ 🤍 💬 📤
        </div>
        
        <div class="post-caption">
        
        <strong>
        {{ post.user.username }}
        </strong>
        
        {{ post.caption }}
        
        </div>
        
        </div>
        
        </div>
        
        {% endfor %}
        

<script>
function openNav() {
  document.getElementById("mySidenav").style.width = "250px";
  document.getElementById("main").style.marginLeft = "250px";
}

function closeNav() {
  document.getElementById("mySidenav").style.width = "0";
  document.getElementById("main").style.marginLeft= "0";
}
</script>
   
</body>
</html>
